[package]
name = "scriptsync"
version = "0.1.0"
rust-version = "1.88"
authors = []
description = "Bidirectional Roblox script synchronization tool"
license = "MPL-2.0"
readme = "README.md"
edition = "2021"
build = "build.rs"

exclude = ["/test-projects/**", "/plugin/**"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[features]
default = []

# Workspace kept for potential future sub-crates
# [workspace]
# members = ["crates/*"]

[lib]
name = "libscriptsync"
path = "src/lib.rs"

[dependencies]
rbx_binary = { version = "2.0.1", features = ["unstable_text_format"] }
rbx_dom_weak = "4.1.0"
rbx_xml = "2.0.1"

anyhow = "1.0.80"
backtrace = "0.3.69"
crossbeam-channel = "0.5.12"
dirs = "5.0.1"
env_logger = "0.9.3"
fs-err = "2.11.0"
hyper = { version = "0.14.28", features = ["server", "tcp", "http1"] }
log = "0.4.21"
notify = "6.1.1"
roblox_install = "1.0.0"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.8"
termcolor = "1.4.1"
thiserror = "1.0.57"
tokio = { version = "1.36.0", features = ["rt", "rt-multi-thread", "macros"] }
clap = { version = "3.2.25", features = ["derive"] }

[build-dependencies]
embed-resource = "1.8.0"

[dev-dependencies]
tempfile = "3.10.1"
